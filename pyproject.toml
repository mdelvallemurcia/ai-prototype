[project]
name = "mealmate-ai"
version = "0.1.0"
description = "AI-powered recipe assistant using RAG with NVIDIA Build API"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-nvidia-ai-endpoints>=0.3",
    "langchain-postgres>=0.0.12",
    "langchain-community>=0.3",
    "streamlit>=1.40",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "yt-dlp>=2024.0",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.15.14",
    "testcontainers[postgres]>=4.14.2",
]
